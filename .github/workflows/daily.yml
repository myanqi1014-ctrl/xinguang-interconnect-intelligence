name: Daily intelligence collection
on:
  schedule:
    - cron: "0 4 * * *" # 12:00 Asia/Shanghai
  push:
    branches: [main]
    paths-ignore: ["data/**", "README.md"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Determine update mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "$(git diff --name-only HEAD^ HEAD)" = "config/title_translations.json" ]; then
            echo "collect=false" >> "$GITHUB_OUTPUT"
          else
            echo "collect=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Collect official news
        if: steps.mode.outputs.collect == 'true'
        run: python scripts/collect.py
      - name: Apply Chinese titles
        run: python scripts/translate_titles.py
      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/collection_log.json
          git diff --cached --quiet || git commit -m "chore: daily official news collection"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment